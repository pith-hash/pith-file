[package]
name = "pith-file"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/pith-hash/pith-file"
homepage = "https://github.com/pith-hash/pith-file"
description = "File-domain hashing for the pith suite: FastCDC chunk signatures, exact chunk-set Jaccard, PDF text extraction"
readme = "README.md"
categories = ["algorithms", "cryptography"]
keywords = ["fastcdc", "deduplication", "jaccard", "pdf", "hashing"]

[lib]
# The cdylib is the binary every language SDK binds through (ctypes,
# koffi, cgo); the rlib keeps the Rust consumers unchanged.
crate-type = ["cdylib", "rlib"]

[features]
# Default-on: the cdylib needs std for its panic handler. The library
# itself stays no_std-compatible (`--no-default-features` still builds).
default = ["std"]
std = []

[dependencies]
# FastCDC chunking and SHA-256 come from sibling suite crates; the
# fleet-wide error/result types live in pith-digest.
pith-digest = { git = "https://github.com/pith-hash/pith-digest.git", branch = "main" }
pith-cdc = { git = "https://github.com/pith-hash/pith-cdc.git", branch = "main" }
# PDF text extraction is a runtime dependency: its Error type carries
# page/object attribution and is wrapped as Error::Pdf rather than
# folded into pith-digest::Error.
pith-pdf = { git = "https://github.com/pith-hash/pith-pdf.git", branch = "main" }

# Vector generator: regenerates reference.json (CI verifies it is current,
# CD ships it with the SDK artifacts).
[[bin]]
name = "gen-reference"
path = "tools/gen-reference/main.rs"

# `unsafe_code` is denied at the crate root (`#![deny(unsafe_code)]` in
# src/lib.rs), with the single `#![allow(unsafe_code)]` confined to
# src/ffi.rs, the C ABI surface. It cannot live here: `[lints]` entries
# become command-line flags, and command-line lints cannot be
# re-allowed by inner attributes.
[lints.rust]
missing_docs = "deny"
